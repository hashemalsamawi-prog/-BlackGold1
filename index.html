<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الذهب الأسود (Black Gold) | متجر الفحم الفاخر والتوصيل المباشر</title>
    <!-- Google Fonts: Cairo & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #0A0A0B;
        color: #F8FAFC;
        margin: 0;
        padding: 0;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      }
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A0A0B;
      }
    </style>
  </head>
  <body class="bg-[#0A0A0B] text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-amber-500 selection:text-black">
    <div id="root">
      <div id="loading-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0A0A0B; color: #F8FAFC; text-align: center; padding: 24px; font-family: 'Cairo', sans-serif;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px; box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);">
          👑
        </div>
        <h1 style="color: #F59E0B; font-size: 22px; font-weight: 900; margin: 0 0 8px 0;">متجر الذهب الأسود</h1>
        <p id="loading-status" style="color: #94A3B8; font-size: 14px; margin: 0 0 16px 0;">جاري تحميل الفحم الملكي والخدمات الفورية...</p>
        
        <div id="loading-fallback" style="display: none; max-width: 320px; width: 100%; margin-top: 10px;">
          <button onclick="window.location.reload(true)" style="width: 100%; padding: 12px 18px; border-radius: 12px; background: #F59E0B; color: #000; font-weight: 800; font-size: 14px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);">
            🔄 إعادة تحميل المتجر الآن
          </button>
        </div>
      </div>
    </div>
    <script>
      // Display fallback action if modules take more than 4s on mobile
      setTimeout(function() {
        var fallback = document.getElementById('loading-fallback');
        var status = document.getElementById('loading-status');
        if (fallback && status) {
          fallback.style.display = 'block';
          status.innerText = 'يستغرق التحميل وقتاً أطول من المعتاد بسبب سرعة الشبكة...';
        }
      }, 4000);

      window.addEventListener('error', function(e) {
        console.error('Global window error:', e.error || e.message);
        var status = document.getElementById('loading-status');
        var fallback = document.getElementById('loading-fallback');
        if (status) {
          status.innerText = 'حدث خطأ أثناء تحميل السكريبت: ' + (e.message || 'خطأ غير معروف');
          status.style.color = '#F87171';
        }
        if (fallback) fallback.style.display = 'block';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
