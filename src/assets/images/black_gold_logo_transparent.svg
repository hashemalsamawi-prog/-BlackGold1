<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:transparent;">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="30%" stop-color="#DFAC37" />
      <stop offset="70%" stop-color="#FCE182" />
      <stop offset="100%" stop-color="#9C6B16" />
    </linearGradient>

    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF099" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Silver Gradient for BLACK text -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#D6D9E0" />
      <stop offset="70%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Charcoal Facet Gradients -->
    <linearGradient id="coalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A32" />
      <stop offset="100%" stop-color="#101014" />
    </linearGradient>
    <linearGradient id="coalMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383844" />
      <stop offset="100%" stop-color="#1A1A22" />
    </linearGradient>
    <linearGradient id="coalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A58" />
      <stop offset="100%" stop-color="#242430" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ==================== TOP: CHARCOAL NUGGETS CLUSTER WITH GOLDEN EDGES ==================== -->
  <g transform="translate(500, 115) scale(0.9)" text-anchor="middle" filter="url(#softShadow)">
    
    <!-- Central Charcoal Big Rock -->
    <!-- Facet 1 (Left top) -->
    <polygon points="-55,-80 -15,-105 -5,-55 -60,-35" fill="url(#coalMid)" stroke="url(#goldGrad1)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Facet 2 (Top center) -->
    <polygon points="-15,-105 35,-95 45,-50 -5,-55" fill="url(#coalLight)" stroke="url(#goldGrad1)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Facet 3 (Right top) -->
    <polygon points="35,-95 65,-65 45,-25 45,-50" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Facet 4 (Center core) -->
    <polygon points="-5,-55 45,-50 25,-10 -35,-5" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Facet 5 (Left bottom) -->
    <polygon points="-60,-35 -5,-55 -35,-5 -75, -5" fill="url(#coalMid)" stroke="url(#goldGrad1)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Facet 6 (Right bottom) -->
    <polygon points="45,-50 45,-25 60,15 25,-10" fill="url(#coalLight)" stroke="url(#goldGrad1)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-35,-5 25,-10 15,25 -20,20" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="4" stroke-linejoin="round"/>

    <!-- Left Rock Small -->
    <polygon points="-130,-40 -90,-65 -75,-25 -115, -10" fill="url(#coalLight)" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-90,-65 -55,-50 -60,-15 -75,-25" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-115,-10 -75,-25 -80,18 -125, 10" fill="url(#coalMid)" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Far Left Tiny Rock -->
    <polygon points="-170,-10 -135,-30 -125,5 -160, 20" fill="url(#coalMid)" stroke="url(#goldGrad1)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="-135,-30 -115,-15 -110,15 -125, 5" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="3" stroke-linejoin="round"/>

    <!-- Right Rock Medium -->
    <polygon points="65,-45 105,-60 120,-20 80, -10" fill="url(#coalLight)" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="105,-60 145,-40 140,-5 120,-20" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="80,-10 120,-20 125,18 75, 15" fill="url(#coalMid)" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Far Right Small Rock -->
    <polygon points="140,-15 175,-25 185,10 150, 18" fill="url(#coalLight)" stroke="url(#goldGrad1)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="125,0 150,18 135,30 115, 20" fill="url(#coalDark)" stroke="url(#goldGrad1)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Small Ember Nugget in Front -->
    <polygon points="-10,15 15,10 20,32 -5,35" fill="url(#coalLight)" stroke="url(#goldGrad1)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- ==================== MIDDLE ROW: BLACK GOLD ==================== -->
  <!-- "BLACK" in Metallic Chrome/Silver -->
  <text x="290" y="275" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="105" letter-spacing="6" fill="url(#silverGrad)" stroke="#111" stroke-width="2" text-anchor="middle" filter="url(#softShadow)">BLACK</text>
  
  <!-- "GOLD" in Metallic Polished Gold -->
  <text x="730" y="275" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="105" letter-spacing="6" fill="url(#goldGrad1)" stroke="#8A5A00" stroke-width="2" text-anchor="middle" filter="url(#goldGlow)">GOLD</text>

  <!-- ==================== BOTTOM ROW: Arabic Calligraphy "الذهب الأسود" ==================== -->
  <g transform="translate(500, 420)" text-anchor="middle" filter="url(#goldGlow)">
    <text x="0" y="0" font-family="'Cairo', 'Amiri', 'Tajawal', sans-serif" font-weight="900" font-size="130" letter-spacing="-2" fill="url(#goldGrad1)" stroke="#784B04" stroke-width="3.5">
      الذهب الأسـود
    </text>
  </g>

  <!-- ==================== FOOTER SUBTITLE: "Premium & Delivery Solutions" ==================== -->
  <text x="500" y="485" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="28" letter-spacing="5.5" fill="url(#goldGrad2)" text-anchor="middle" filter="url(#softShadow)">
    PREMIUM &amp; DELIVERY SOLUTIONS
  </text>
</svg>
